<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro | Helpe Lojas</title>
    <link rel="stylesheet" href="../assets/css/base.css" />
    <link rel="stylesheet" href="../assets/css/components.css" />
    <link rel="stylesheet" href="../assets/css/public.css" />
  </head>
  <body data-layout="public" data-page="cadastro">
    <div id="navbar"></div>

    <main class="container section" style="max-width: 520px;">
      <form id="register-form" class="card">
        <h2>Criar conta</h2>
        <div class="form-group">
          <label>Nome</label>
          <input class="input" name="name" required />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input class="input" name="email" type="email" required />
        </div>
        <div class="form-group">
          <label>Senha</label>
          <input class="input" name="password" type="password" required minlength="8" />
        </div>
        <div class="form-group">
          <label>Confirmar senha</label>
          <input class="input" name="confirmPassword" type="password" required minlength="8" />
        </div>
        <button class="button">Cadastrar</button>
      </form>
    </main>

    <div id="footer"></div>
    <script type="module" src="../assets/js/app.js"></script>
  </body>
</html>
