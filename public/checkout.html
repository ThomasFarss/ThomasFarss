<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout | Helpe Lojas</title>
    <link rel="stylesheet" href="../assets/css/base.css" />
    <link rel="stylesheet" href="../assets/css/components.css" />
    <link rel="stylesheet" href="../assets/css/public.css" />
  </head>
  <body data-layout="public" data-page="checkout">
    <div id="navbar"></div>

    <main class="container section">
      <div class="checkout-grid">
        <form id="checkout-form" class="card">
          <h2>Dados do cliente</h2>
          <div class="form-group">
            <label>Nome</label>
            <input class="input" name="name" required />
          </div>
          <div class="form-group">
            <label>Email</label>
            <input class="input" name="email" type="email" required />
          </div>
          <h3>Pagamento</h3>
          <label><input type="radio" name="payment" value="pix" checked /> Pix</label>
          <label><input type="radio" name="payment" value="cartao" /> Cartão</label>
          <button class="button" style="margin-top: 16px;">Confirmar pedido</button>
          <div id="checkout-success" class="alert hidden" style="margin-top: 16px;">
            Pedido confirmado! Você receberá os detalhes por email.
          </div>
        </form>
        <div id="checkout-summary"></div>
      </div>
    </main>

    <div id="footer"></div>
    <script type="module" src="../assets/js/app.js"></script>
  </body>
</html>
