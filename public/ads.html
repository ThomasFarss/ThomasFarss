<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DreamsLive Shop | Anúncios</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <div class="brand">DreamsLive Shop</div>
        <div class="nav-links">
          <a href="index.html">Início</a>
          <a href="ads.html">Anúncios</a>
          <a href="advertisers.html">Para Anunciantes</a>
          <a href="seller-dashboard.html">Painel do Anunciante</a>
          <a href="affiliates.html">Afiliados</a>
          <a href="pricing.html">Planos & Descontos</a>
          <a href="login.html">Login</a>
        </div>
        <div class="user-area" id="userArea"></div>
      </nav>
    </header>

    <main>
      <section class="section">
        <h2>Anúncios em destaque</h2>
        <p>Lista de produtos do próprio site e anúncios externos.</p>
        <div class="grid" id="adsGrid"></div>
      </section>

      <section class="section">
        <h2>Cadastre um anúncio interno</h2>
        <div class="card">
          <form class="form" id="adForm">
            <input type="text" name="title" placeholder="Título do anúncio" required />
            <input type="text" name="price" placeholder="Preço (ex: R$ 99,90)" required />
            <input type="text" name="seller" placeholder="Vendedor / Loja" required />
            <input type="text" name="category" placeholder="Categoria" />
            <select name="type">
              <option value="Interno">Interno</option>
              <option value="Externo">Externo</option>
            </select>
            <button class="button" type="submit">Publicar anúncio</button>
          </form>
          <div class="notice" id="adNotice" style="display: none;"></div>
        </div>
      </section>
    </main>

    <footer class="footer">DreamsLive Shop • Gestão de anúncios inteligente.</footer>

    <script src="app.js"></script>
  </body>
</html>
