<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Helpe Lojas</title>
    <link rel="stylesheet" href="../assets/css/base.css" />
    <link rel="stylesheet" href="../assets/css/components.css" />
    <link rel="stylesheet" href="../assets/css/public.css" />
  </head>
  <body data-layout="public" data-page="login">
    <div id="navbar"></div>

    <main class="container section" style="max-width: 480px;">
      <form id="login-form" class="card">
        <h2>Entrar</h2>
        <div class="form-group">
          <label>Email</label>
          <input class="input" name="email" type="email" required />
        </div>
        <div class="form-group">
          <label>Senha</label>
          <input class="input" name="password" type="password" required />
        </div>
        <button class="button">Acessar</button>
        <p class="text-muted">Não possui conta? <a href="cadastro.html">Cadastre-se</a></p>
      </form>
    </main>

    <div id="footer"></div>
    <script type="module" src="../assets/js/app.js"></script>
  </body>
</html>
