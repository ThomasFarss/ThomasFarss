<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configurações | Admin</title>
    <link rel="stylesheet" href="../assets/css/base.css" />
    <link rel="stylesheet" href="../assets/css/components.css" />
    <link rel="stylesheet" href="../assets/css/admin.css" />
  </head>
  <body data-page="config">
    <div class="admin-layout">
      <aside class="sidebar" id="admin-sidebar"></aside>
      <section class="admin-content">
        <header class="header-admin">
          <h1>Configurações</h1>
          <button class="button secondary" id="admin-logout">Sair</button>
        </header>
        <form id="config-form" class="card">
          <div class="form-row">
            <div class="form-group">
              <label>Nome da loja</label>
              <input class="input" name="storeName" required />
            </div>
            <div class="form-group">
              <label>Cor primária</label>
              <input class="input" name="primaryColor" type="color" />
            </div>
            <div class="form-group">
              <label>Cor secundária</label>
              <input class="input" name="secondaryColor" type="color" />
            </div>
            <div class="form-group">
              <label>Cor de destaque</label>
              <input class="input" name="accentColor" type="color" />
            </div>
            <div class="form-group">
              <label>Email de contato</label>
              <input class="input" name="contactEmail" type="email" />
            </div>
            <div class="form-group">
              <label>Telefone</label>
              <input class="input" name="contactPhone" />
            </div>
          </div>
          <button class="button">Salvar configurações</button>
        </form>
      </section>
    </div>

    <script type="module" src="../assets/js/app.js"></script>
  </body>
</html>
