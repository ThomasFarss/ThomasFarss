<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pedidos | Admin</title>
    <link rel="stylesheet" href="../assets/css/base.css" />
    <link rel="stylesheet" href="../assets/css/components.css" />
    <link rel="stylesheet" href="../assets/css/admin.css" />
  </head>
  <body data-page="pedidos">
    <div class="admin-layout">
      <aside class="sidebar" id="admin-sidebar"></aside>
      <section class="admin-content">
        <header class="header-admin">
          <h1>Pedidos</h1>
          <button class="button secondary" id="admin-logout">Sair</button>
        </header>
        <div class="section-title">
          <div>
            <label>Status</label>
            <select id="orders-filter" class="input">
              <option value="">Todos</option>
              <option value="novo">Novo</option>
              <option value="pago">Pago</option>
              <option value="entregue">Entregue</option>
              <option value="cancelado">Cancelado</option>
            </select>
          </div>
          <button class="button" id="export-orders">Exportar CSV</button>
        </div>
        <table class="table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Status</th>
              <th>Total</th>
              <th>Data</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="orders-table"></tbody>
        </table>
        <div class="section" id="order-detail"></div>
      </section>
    </div>

    <script type="module" src="../assets/js/app.js"></script>
  </body>
</html>
