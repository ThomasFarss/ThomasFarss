<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Produtos | Admin</title>
    <link rel="stylesheet" href="../assets/css/base.css" />
    <link rel="stylesheet" href="../assets/css/components.css" />
    <link rel="stylesheet" href="../assets/css/admin.css" />
  </head>
  <body data-page="produtos">
    <div class="admin-layout">
      <aside class="sidebar" id="admin-sidebar"></aside>
      <section class="admin-content">
        <header class="header-admin">
          <h1>Produtos</h1>
          <button class="button secondary" id="admin-logout">Sair</button>
        </header>
        <div class="card">
          <h3>Novo / Editar produto</h3>
          <form id="product-form" class="form-row">
            <input type="hidden" name="id" />
            <input class="input" name="name" placeholder="Nome" required />
            <input class="input" name="category" placeholder="Categoria" required />
            <input class="input" name="price" placeholder="Preço" type="number" step="0.01" required />
            <input class="input" name="stock" placeholder="Estoque" type="number" />
            <input class="input" name="image" placeholder="URL da imagem" />
            <input class="input" name="status" placeholder="Status" required />
            <textarea class="input" name="description" placeholder="Descrição" rows="2"></textarea>
            <button class="button">Salvar</button>
          </form>
        </div>

        <section class="section">
          <div class="section-title">
            <h2>Lista de produtos</h2>
            <input class="input" id="product-search" placeholder="Buscar produto" />
          </div>
          <table class="table">
            <thead>
              <tr>
                <th>Produto</th>
                <th>Categoria</th>
                <th>Preço</th>
                <th>Status</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="products-table"></tbody>
          </table>
        </section>
      </section>
    </div>

    <script type="module" src="../assets/js/app.js"></script>
  </body>
</html>
